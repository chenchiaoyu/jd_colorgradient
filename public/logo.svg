<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .black { fill: #111111; }
      .white { fill: #FFFFFF; }
      .stroke-black { stroke: #111111; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" rx="90" fill="#FFFFFF" />
  
  <g transform="translate(200, 200)">
    {/* Outer decorative interlocking rays / geometric frame */}
    <g class="black">
      <circle cx="0" cy="0" r="160" fill="none" stroke="#111111" stroke-width="24" />
    </g>
    <circle cx="0" cy="0" r="148" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-dasharray="36 18" />
    
    {/* Radiating geometric ribbon pattern */}
    <g stroke="#111111" stroke-width="16" stroke-linecap="round">
      <line x1="-150" y1="0" x2="150" y2="0" />
      <line x1="0" y1="-150" x2="0" y2="150" />
      <line x1="-106" y1="-106" x2="106" y2="106" />
      <line x1="-106" y1="106" x2="106" y2="-106" />
    </g>

    {/* Inner white cutout ring */}
    <circle cx="0" cy="0" r="110" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#111111" stroke-width="12" />

    {/* 8-petal central rosette */}
    <g fill="#111111">
      <path d="M0,0 C-22,-45 -45,-22 0,-75 C45,-22 22,-45 0,0 Z" />
      <path d="M0,0 C-22,-45 -45,-22 0,-75 C45,-22 22,-45 0,0 Z" transform="rotate(45)" />
      <path d="M0,0 C-22,-45 -45,-22 0,-75 C45,-22 22,-45 0,0 Z" transform="rotate(90)" />
      <path d="M0,0 C-22,-45 -45,-22 0,-75 C45,-22 22,-45 0,0 Z" transform="rotate(135)" />
      <path d="M0,0 C-22,-45 -45,-22 0,-75 C45,-22 22,-45 0,0 Z" transform="rotate(180)" />
      <path d="M0,0 C-22,-45 -45,-22 0,-75 C45,-22 22,-45 0,0 Z" transform="rotate(225)" />
      <path d="M0,0 C-22,-45 -45,-22 0,-75 C45,-22 22,-45 0,0 Z" transform="rotate(270)" />
      <path d="M0,0 C-22,-45 -45,-22 0,-75 C45,-22 22,-45 0,0 Z" transform="rotate(315)" />
    </g>

    {/* Center core white star */}
    <circle cx="0" cy="0" r="18" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="8" fill="#111111" />
  </g>
</svg>
